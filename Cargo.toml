[package]
name = "claude-account"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Profile switcher for multiple Claude Code accounts on Linux and macOS"
authors = ["Hamza Rehman", "Jack Gardner"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/JackCGardner/claude-account-switcher-mac"
repository = "https://github.com/JackCGardner/claude-account-switcher-mac"
keywords = ["claude-code", "profiles", "account-switcher", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3.19"
